# Canonical list of Indic languages for this research.
# "Indic" means the language typology of the Indian subcontinent,
# not the geography of India. See .plans/brief.md.
#
# code:   Wikimedia language code (subdomain), not always ISO 639.
# family: indo-aryan | dravidian | munda | tibeto-burman
# status: include = in scope.
#         exclude = out of scope by decision. Kept as a record.
# The fetch_inventory.py script validates each code against the
# Wikimedia sitematrix. A code with no wiki is reported, not an error.

languages:
  # --- Indo-Aryan ---
  - code: anp
    name: Angika
    family: indo-aryan
    script: Devanagari
    status: include
  - code: as
    name: Assamese
    family: indo-aryan
    script: Bengali-Assamese
    status: include
